[project]
name = "appointment-scheduler-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn", "httpx", "pydantic", "pyyaml", "python-dotenv",
    "langgraph>=1.2", "langchain>=1.0", "langchain-google-genai>=4.4", "langfuse>=4.17",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = []   # run from the repo root (python -m ...); installing only pulls dependencies
