id: S5
title: Transient availability failure recovers
primary_failure_class: F1
exercises: {transitions: [T01, T02], invariants: [I11]}
why_it_matters: Short blips should be invisible to the patient; retries must stay bounded.
faults:
  - {tool: search_slots, fault: error_503, calls: [1, 2]}
turns:
  - user: "Hi, I'm Asha Verma, date of birth 1990-04-12. I need a checkup with Dr. Rao, earliest available slot please."
  - user: "The earliest one, please."
  - user: "Yes, please book it."
expect:
  final_state: BOOKED
  active_bookings: 1
  tool_calls_max: {search_slots: 6}
  events_required: [retry.scheduled]
