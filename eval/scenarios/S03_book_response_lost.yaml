id: S3
title: Booking committed but response lost
primary_failure_class: F2
exercises: {transitions: [T08, T13, T15], invariants: [I2, I3, I7]}
why_it_matters: The classic agent failure. A blind retry double-books; giving up tells the patient a lie.
faults:
  - {tool: book_appointment, fault: timeout_after_commit, calls: [1]}
turns:
  - user: "Hi, I'm Asha Verma, date of birth 1990-04-12. I need a checkup with Dr. Rao, earliest available slot please."
  - user: "The earliest one, please."
  - user: "Yes, please book it."
expect:
  final_state: BOOKED
  active_bookings: 1
  tool_calls: {book_appointment: 1}
  events_required: [reconcile.resolved]
